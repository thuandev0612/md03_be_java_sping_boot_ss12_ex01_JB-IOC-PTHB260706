spring.application.name=baitapSession11
server.error.include-stacktrace=never
server.error.include-message=never
spring.config.import=optional:file:../.local-config/baitapSession11.properties,optional:file:./config/application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medical_session11}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.org.hibernate=DEBUG
logging.level.com.medical.service=TRACE
logging.charset.console=UTF-8
logging.file.name=logs/patient_web_service.log
logging.charset.file=UTF-8
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-file-size=2MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.clean-history-on-start=true
