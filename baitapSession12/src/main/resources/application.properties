spring.application.name=baitapSession12
spring.config.import=optional:file:../.local-config/baitapSession12.properties,optional:file:./config/application-local.properties
server.error.include-stacktrace=never
server.error.include-message=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medical_supplies_session12}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.deserialization.accept-float-as-int=false

logging.level.root=INFO
logging.level.com.example.baitapsession12.service=DEBUG
logging.file.name=logs/medical_supplies.log
logging.charset.console=UTF-8
logging.charset.file=UTF-8
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-file-size=2MB
logging.logback.rollingpolicy.max-history=7
